<div id="game-shell">
  <canvas id="canvas" width="420" height="380"></canvas>
</div>

<section id="lower-screen">
  <div id="hud">
    <div class="player-summary">
      <div class="orb">
        <div class="level-badge" id="player-level">999</div>

        <div id="exp-fill" class="exp-ring">
          <div class="hp-circle">
            <div id="hp-fill" class="hp-fill"></div>
          </div>
        </div>
      </div>

      <div class="orb-values">
        <div>HP <strong id="hp-text">0 / 0</strong></div>
        <div>EXP <strong id="exp-text">0 / 0</strong></div>
      </div>

      <div class="orb-values">
        <div>GOLD <strong id="gold">0</strong></div>
        <div>KILLS <strong id="kills">0</strong></div>
        <div>DEATHS <strong id="deaths">0</strong></div>
      </div>
      <div class="orb-values">
        <div>ATK<strong id="atk">0</strong></div>
        <div>DEF<strong id="def">0</strong></div>
        <div>SPD<strong id="spd">0</strong></div>
      </div>
    </div>

    <div class="battle-header">
      <span id="enemy-name">—</span>
      <span id="battle-state">IDLE</span>
    </div>

    <div id="battle-log" aria-live="polite"></div>
  </div>
</section>
