<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101010" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
    <title>Idle JS</title>
  </head>
  <body>
    <div id="orientation-warning" aria-hidden="true">
      <div class="orientation-card">
        <div class="orientation-icon">↻</div>
        <div>Rotate to portrait</div>
      </div>
    </div>

    <main id="app">
      <section id="console" aria-label="Idle RPG">
        <div id="view-container"></div>

        <div id="bottom-nav">
          <button class="button" data-action="home">Home</button>
          <button class="button" data-action="bag">Bag</button>
          <button class="button" data-action="battle">Battle</button>
          <button class="button" data-action="settings">Settings</button>
        </div>
      </section>
    </main>
    <dialog id="dialog" class="dialog"></dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
